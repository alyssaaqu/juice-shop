name: Trivy Security Scan
on:
  push:
    branches:
      - trivy-scan
  pull_request:
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan file system
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          ignore-unfixed: true
      
      - name: Scan configs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL, HIGH'

      - name: Upload config scan results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-config-results.sarif'

      - name: Build Docker image
        run: docker build -t juice-shop:security-test . 

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: 'juice-shop:security-test'
          exit-code: '1'
          ignore-unfixed: true 
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload image scan results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with: 
          sarif_file: 'trivy-image-results.sarif'